# GitHub Pages: every Sunday (and on every push to main) downloads fresh GTFS timetables, generates
# the data with update_data.sh and publishes the site together with the data. Generated data is not in the repo.
# The OSM walking network comes from walk_osm.tar.xz in the repo (refreshed by hand, see README).
# The last good GTFS ZIPs are cached too: if one feed fails to download, the previous copy is used,
# the site is still deployed with the other feeds fresh, and the run is marked as failed afterwards.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * 0"   # Sundays, UTC = 3:30 (winter) / 4:30 (summer) in Kraków
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # keeping the schedule alive (see below)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore last good GTFS feeds from cache
        uses: actions/cache/restore@v4
        with:
          path: "*.zip"
          key: gtfs-${{ github.run_id }}
          restore-keys: gtfs-

      - name: Download timetables and generate data
        run: bash update_data.sh

      - name: Save GTFS feeds to cache
        uses: actions/cache/save@v4
        with:
          path: "*.zip"
          key: gtfs-${{ github.run_id }}

      - name: Copy site and data to public/
        run: |
          mkdir -p public
          cp index.html style.css stops_data.json walk.bin transfers.bin public/
          cp -r js deps conns public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub disables scheduled workflows after 60 days without commits; re-enabling resets the timer
      - name: Keep the weekly schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"

      # the site is already deployed; failing here only makes a stale feed visible (and emailed)
      - name: Fail if any feed used a previous copy
        run: |
          if [ -s stale_feeds.txt ]; then
            echo "::error::Deployed with previous copies of: $(paste -sd ' ' stale_feeds.txt)"
            exit 1
          fi
